services:
  - type: web
    name: mahabharata-18-parvas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Dharmaraja Admin
      - key: ADMIN_EMAIL
        value: admin@mahabharata.quest
      - key: ADMIN_PASSWORD
        generateValue: true
